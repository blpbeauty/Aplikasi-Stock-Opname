<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Logo BLP SO">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="116" ry="116" />
    </clipPath>
    <!-- Hitam Soft matte backdrop gradient -->
    <linearGradient id="bgSoftBlack" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#272C2E" />
      <stop offset="55%" stop-color="#1D2123" />
      <stop offset="100%" stop-color="#15181A" />
    </linearGradient>

    <!-- Soft ambient Aqua Pastel aura in upper canvas -->
    <radialGradient id="topAura" cx="0.5" cy="0.38" r="0.46">
      <stop offset="0%" stop-color="#9BE8E5" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#9BE8E5" stop-opacity="0" />
    </radialGradient>

    <!-- Aqua Soft Pastel gradient for lower section -->
    <linearGradient id="aquaPastel" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#BCEFED" />
      <stop offset="52%" stop-color="#94DFDC" />
      <stop offset="100%" stop-color="#6FC9C4" />
    </linearGradient>

    <!-- Soft Aqua Pastel sheen for BLP letterforms -->
    <linearGradient id="blpFill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#EEFCFC" />
      <stop offset="55%" stop-color="#C8F2F0" />
      <stop offset="100%" stop-color="#98E0DC" />
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Upper Base: Hitam Soft -->
    <rect x="0" y="0" width="512" height="512" fill="url(#bgSoftBlack)" />
    <rect x="0" y="0" width="512" height="320" fill="url(#topAura)" />

    <!-- Minimalist Scan Viewfinder Corner Ticks inside Safe Zone -->
    <g fill="none" stroke="#9BE4E1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.48">
      <path d="M 122 154 V 136 Q 122 126 132 126 H 150" />
      <path d="M 362 126 H 380 Q 390 126 390 136 V 154" />
      <path d="M 122 238 V 248 Q 122 258 132 258 H 150" />
      <path d="M 362 258 H 380 Q 390 258 390 248 V 238" />
    </g>

    <!-- Lower Base: Curved Aqua Soft Pastel -->
    <path d="M 0 282 Q 256 268 512 282 L 512 512 L 0 512 Z" fill="url(#aquaPastel)" />
    <path d="M 0 282 Q 256 268 512 282" fill="none" stroke="#ECFCFB" stroke-opacity="0.6" stroke-width="2.5" />

    <!-- Hero Typography: BLP (Aqua Soft Pastel over Hitam Soft) -->
    <g fill="url(#blpFill)">
      <!-- B (x: 150..216, y: 150..240) -->
      <path
        fill-rule="evenodd"
        d="M 156 150 H 189 C 204 150 214 158.5 214 171 C 214 180.5 208 187.5 200 191 C 210 195 216 203.5 216 215.5 C 216 230.5 204 240 187 240 H 156 Q 150 240 150 234 V 156 Q 150 150 156 150 Z
           M 168 165 V 184 H 186 C 193 184 196.5 180 196.5 174.5 C 196.5 169 193 165 186 165 H 168 Z
           M 168 199.5 V 224 H 187 C 194.5 224 198.5 219.5 198.5 211.75 C 198.5 204 194.5 199.5 187 199.5 H 168 Z"
      />
      <!-- L (x: 234..284, y: 150..240) -->
      <path
        d="M 239 150 H 247 Q 252 150 252 155 V 223 H 279 Q 284 223 284 228 V 235 Q 284 240 279 240 H 239 Q 234 240 234 235 V 155 Q 234 150 239 150 Z"
      />
      <!-- P (x: 300..364, y: 150..240) -->
      <path
        fill-rule="evenodd"
        d="M 306 150 H 337 C 355 150 364 160.5 364 177.5 C 364 194.5 355 205 337 205 H 319 V 235 Q 319 240 314 240 H 306 Q 300 240 300 235 V 155 Q 300 150 306 150 Z
           M 319 165.5 V 189.5 H 335.5 C 343.5 189.5 347 184.5 347 177.5 C 347 170.5 343.5 165.5 335.5 165.5 H 319 Z"
      />
    </g>

    <!-- Secondary Badge Text: SO (Hitam Soft over Aqua Soft Pastel) -->
    <g>
      <!-- Subtle flanking balance dashes -->
      <rect x="164" y="334" width="18" height="4" rx="2" fill="#1C2022" fill-opacity="0.32" />
      <rect x="330" y="334" width="18" height="4" rx="2" fill="#1C2022" fill-opacity="0.32" />

      <!-- S (outer bounds x: 196..245, y: 307..365) -->
      <path
        d="M 237 319.5 C 233 314.5 225.5 313 218.5 313.5 C 208 314 202.5 319.5 202.5 326 C 202.5 333 209 335.5 220 337.5 C 231.5 340 238.5 343.5 238.5 351.5 C 238.5 359.5 231 364.5 220.5 364.5 C 211 364.5 203.5 361.5 200 356.5"
        fill="none"
        stroke="#1C2022"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- O (outer bounds x: 264..315, y: 307..365) -->
      <rect
        x="270"
        y="313.5"
        width="39"
        height="51"
        rx="19.5"
        fill="none"
        stroke="#1C2022"
        stroke-width="12"
      />
    </g>
    <!-- Subtle outer rim for rounded app badge -->
    <rect x="2" y="2" width="508" height="508" rx="114" ry="114" fill="none" stroke="#9EEAE7" stroke-opacity="0.24" stroke-width="3" />
  </g>
</svg>
